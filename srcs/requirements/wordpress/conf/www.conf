[www]
; www-data 是 Debian/Ubuntu 系统默认专门分给 Web 服务的低权限账户。这是一个重要的安全机制
user = www-data
group = www-data
; 让 PHP-FPM (FastCGI Process Manager） 监听 9000 端口
listen = 9000
listen.owner = www-data
listen.group = www-data
; 进程管理器 动态分配资源
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 1
pm.max_spare_servers = 10
clear_env = no