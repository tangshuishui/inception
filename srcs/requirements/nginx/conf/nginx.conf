# Nginx 在这个项目中扮演着反向代理（Reverse Proxy）和静态文件服务器的角色。它是整个架构的大门
# 负责接收外界的 HTTPS 请求，并把涉及 PHP 的动态任务派发给里面的 WordPress 容器。
server {
    # 监听 443 HTTPS标准端口（IPv4 和 IPv6）
    # ssl 访问这个端口的所有流量都必须使用加密连接
    listen 443 ssl;
    listen [::]:443 ssl;

    # 我的域名
    server_name hanwang.42.fr;

    # SSL 证书路径（公钥-浏览器，私钥-服务器解密）
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    
    # 强制规定 TLS 版本（Subject 强制要求）
    ssl_protocols TLSv1.2 TLSv1.3;

    # 网站根目录（必须与 WordPress 容器中的路径一致，因为它们挂载同一个 volume）
    root /var/www/html;
    
    # 默认主页
    index index.php index.html index.htm;

    # 静态文件请求处理
    # 当用户请求普通的 URL（比如图片、CSS 文件、或者单纯的目录）时，执行这段逻辑。
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP 请求代理，通过FastCGI协议，给 WordPress 容器的 9000 端口
    # 正则表达 location ~ \.php$ ：只要用户请求的URL是以.php结尾，就拦截进去
    location ~ \.php$ {
        # 引入 Debian 系统预先写好的一段标准化配置
        # 里面包含了一些必要的环境变量（告诉 PHP 请求的方法是什么、客户端 IP 是多少等）。
        include snippets/fastcgi-php.conf;
        # wordpress 是容器名，同一个docker-compose网络下，Docker 的内置 DNS 会把它解析为 IP
        fastcgi_pass wordpress:9000; 
    }
}